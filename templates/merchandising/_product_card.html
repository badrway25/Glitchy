{% load static i18n uikit %}
<div class="ymal-card h-100 w-100" data-reco-view>
  <a href="{{ p.get_url }}" class="p-media d-block" style="aspect-ratio:1/1;position:relative;" data-reco-click="{{ p.id }}">
    <img src="{% if p.cover_image %}{{ p.cover_image }}{% else %}{% static 'images/placeholder.png' %}{% endif %}"
         alt="{{ p.product_name }}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;">
    {% if p.on_sale %}<span class="badge-corner badge-out" style="position:absolute;top:10px;left:10px;">{% trans "Sale" %}</span>{% endif %}
  </a>
  <button type="button" class="wish-btn {% if p.id in WISHLIST_IDS %}is-active{% endif %}"
          data-wishlist-toggle data-product-id="{{ p.id }}" aria-label="{% trans 'Save to wishlist' %}"><i class="fa fa-heart"></i></button>
  <div class="p-3">
    <a href="{{ p.get_url }}" class="product-title d-block mb-1" style="font-size:.9rem;">{{ p.product_name|truncatechars:42 }}</a>
    <div class="price" style="font-size:1rem;">{{ CURRENCY_SYMBOL }} {{ p.price }}{% if p.on_sale %} <span class="text-muted" style="text-decoration:line-through;font-size:.85rem;">{{ CURRENCY_SYMBOL }} {{ p.compare_at_price }}</span>{% endif %}</div>
  </div>
</div>
