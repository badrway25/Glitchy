{% load static i18n uikit %}
<div class="ymal-card saved-card">
  <a href="{{ p.get_url }}" class="p-media d-block" style="aspect-ratio:1/1;">
    <img src="{% if p.cover_image %}{{ p.cover_image }}{% else %}{% static 'images/placeholder.png' %}{% endif %}"
         alt="{{ p.product_name }}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;">
  </a>
  {% if saved %}<span class="saved-tag">{% trans "Saved for later" %}</span>{% endif %}
  <div class="p-3">
    <a href="{{ p.get_url }}" class="product-title d-block mb-1" style="font-size:.92rem;">{{ p.product_name|truncatechars:42 }}</a>
    <div class="price mb-2" style="font-size:1rem;">{{ CURRENCY_SYMBOL }} {{ p.price }}</div>
    <div class="d-flex" style="gap:.5rem;">
      <a href="{{ p.get_url }}" class="btn btn-primary btn-sm" style="flex:1;">{% trans "View" %}</a>
      <button type="button" class="btn btn-soft btn-sm wish-btn is-active" data-wishlist-toggle
              data-product-id="{{ p.id }}" title="{% trans 'Remove' %}" aria-label="{% trans 'Remove' %}">
        {% icon "close" "ic" 15 %}
      </button>
    </div>
  </div>
</div>
