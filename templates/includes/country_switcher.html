{% load i18n %}
<form action="{% url 'set_country' %}" method="post" class="country-switcher">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div class="country-select-wrap">
    <select name="country" class="country-select"
            onchange="this.form.submit()" aria-label="{% trans 'Shipping country' %}">
      {% for code, name in ship_countries %}
        <option value="{{ code }}" {% if code == ship_country %}selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </div>
</form>
