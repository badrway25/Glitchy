{% load i18n %}
<form action="{% url 'set_country' %}" method="post" class="country-switcher d-inline-flex align-items-center">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label class="mb-0 mr-2 small text-muted" style="white-space:nowrap;">
    <i class="fa fa-truck mr-1"></i>{% trans "Ship to" %}
  </label>
  <select name="country" class="form-control form-control-sm" style="width:auto;min-width:120px;"
          onchange="this.form.submit()" aria-label="{% trans 'Shipping country' %}">
    {% for code, name in ship_countries %}
      <option value="{{ code }}" {% if code == ship_country %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
</form>
